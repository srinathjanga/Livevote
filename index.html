
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>LiveVote</title>
        <style>
            body {
                  font-family: Arial, sans-serif;
                        max-width: 700px;
                              margin: 40px auto;
                                    padding: 20px;
                                          background: #f4f6f9;
                                                color: #222;
                                                    }
                                                        h1 { color: #3157d5; }
                                                            .card {
                                                                  background: white;
                                                                        padding: 18px;
                                                                              margin: 16px 0;
                                                                                    border-radius: 12px;
                                                                                          box-shadow: 0 2px 8px #0001;
                                                                                              }
                                                                                                  input, button {
                                                                                                        padding: 10px;
                                                                                                              margin: 5px 0;
                                                                                                                    max-width: 100%;
                                                                                                                        }
                                                                                                                            input { box-sizing: border-box; width: 100%; }
                                                                                                                                button {
                                                                                                                                      background: #3157d5;
                                                                                                                                            color: white;
                                                                                                                                                  border: 0;
                                                                                                                                                        border-radius: 6px;
                                                                                                                                                              cursor: pointer;
                                                                                                                                                                  }
                                                                                                                                                                      .option { margin: 10px 0; }
                                                                                                                                                                          #message { white-space: pre-wrap; }
                                                                                                                                                                            </style>
                                                                                                                                                                            </head>
                                                                                                                                                                            <body>
                                                                                                                                                                              <h1>🗳️ LiveVote</h1>
                                                                                                                                                                                <p>Create a poll and let people vote live!</p>

                                                                                                                                                                                  <div class="card">
                                                                                                                                                                                      <h2>Create a poll</h2>
                                                                                                                                                                                          <input id="question" placeholder="Enter your poll question">
                                                                                                                                                                                              <input id="option1" placeholder="Option 1">
                                                                                                                                                                                                  <input id="option2" placeholder="Option 2">
                                                                                                                                                                                                      <button onclick="createPoll()">Create Poll</button>
                                                                                                                                                                                                          <p id="message"></p>
                                                                                                                                                                                                            </div>

                                                                                                                                                                                                              <h2>Available polls</h2>
                                                                                                                                                                                                                <div id="polls">Loading polls...</div>

                                                                                                                                                                                                                  <script>
                                                                                                                                                                                                                      const API = "https://livevote-xqhv.onrender.com";

                                                                                                                                                                                                                          async function loadPolls() {
                                                                                                                                                                                                                                const container = document.getElementById("polls");

                                                                                                                                                                                                                                      try {
                                                                                                                                                                                                                                              const response = await fetch(API + "/api/polls");
                                                                                                                                                                                                                                                      if (!response.ok) throw new Error("Could not load polls");

                                                                                                                                                                                                                                                              const polls = await response.json();
                                                                                                                                                                                                                                                                      container.innerHTML = "";

                                                                                                                                                                                                                                                                              if (!polls.length) {
                                                                                                                                                                                                                                                                                        container.textContent = "No polls yet. Create the first one!";
                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                  polls.forEach(poll => {
                                                                                                                                                                                                                                                                                                                            const card = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                      card.className = "card";

                                                                                                                                                                                                                                                                                                                                                const heading = document.createElement("h3");
                                                                                                                                                                                                                                                                                                                                                          heading.textContent = poll.question;
                                                                                                                                                                                                                                                                                                                                                                    card.appendChild(heading);

                                                                                                                                                                                                                                                                                                                                                                              (poll.options || []).forEach((option, index) => {
                                                                                                                                                                                                                                                                                                                                                                                          const button = document.createElement("button");
                                                                                                                                                                                                                                                                                                                                                                                                      const label = typeof option === "string"
                                                                                                                                                                                                                                                                                                                                                                                                                    ? option
                                                                                                                                                                                                                                                                                                                                                                                                                                  : option.text;

                                                                                                                                                                                                                                                                                                                                                                                                                                              const votes = typeof option === "string"
                                                                                                                                                                                                                                                                                                                                                                                                                                                            ? 0
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          : (option.votes || 0);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      button.textContent = `${label} (${votes} votes)`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  button.onclick = () => vote(poll.id, index);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              card.appendChild(button);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          card.appendChild(document.createElement("br"));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              container.appendChild(card);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    container.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Could not load polls. Check that the Render server is running.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            async function createPoll() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const question = document.getElementById("question").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const options = [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("option1").value.trim(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("option2").value.trim()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ].filter(Boolean);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!question || options.length < 2) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "Enter a question and at least two options.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const response = await fetch(API + "/api/polls", {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            method: "POST",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      headers: { "Content-Type": "application/json" },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                body: JSON.stringify({ question, options })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const result = await response.json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!response.ok) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  throw new Error(result.error || "Poll creation failed");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("message").textContent = "Poll created!";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("question").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("option1").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("option2").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  await loadPolls();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Could not create poll: " + error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        async function vote(pollId, optionIndex) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const response = await fetch(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                API + "/api/polls/" + encodeURIComponent(pollId) + "/vote",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      method: "POST",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  headers: { "Content-Type": "application/json" },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              body: JSON.stringify({ optionIndex })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!response.ok) throw new Error("Voting failed");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                await loadPolls();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              alert("Could not submit your vote. Please try again.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            loadPolls();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                setInterval(loadPolls, 5000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
